name = "adnermo-pan"
main = "worker.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[cache]
enabled = true
cross_version_cache = true

[assets]
directory = "./build"
binding = "ASSETS"

[vars]
WEBDAV_PUBLIC_READ = "1"

[[routes]]
pattern = "pan.adnermo.online"
custom_domain = true

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "adnermo-pan"
